<header class="bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-600 text-white body-font shadow-lg">
  <div class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center">
    <a class="flex title-font font-medium items-center text-white mb-4 md:mb-0 hover:opacity-90 transition-opacity duration-300">
      <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-md transform hover:scale-105 transition-transform duration-300">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round"
          stroke-linejoin="round" stroke-width="2.5" class="w-6 h-6 text-indigo-600" viewBox="0 0 24 24">
          <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
        </svg>
      </div>
      <span class="ml-3 text-xl font-bold tracking-wide">CRM Pro</span>
    </a>

    <nav class="md:ml-auto flex flex-wrap items-center text-base justify-center">
      {% if not request.user.is_authenticated %}
        <a href="{% url 'signup' %}" class="mr-5 text-white/90 hover:text-white font-medium px-3 py-2 rounded-lg hover:bg-white/10 transition-all duration-300">
          Sign Up
        </a>
      {% else %}
        {% if request.user.is_organiser %}
          <a href="{% url 'agents:agents-list' %}" class="mr-5 text-white/90 hover:text-white font-medium px-3 py-2 rounded-lg hover:bg-white/10 transition-all duration-300">
            Agents
          </a>
        {% endif %}
        <a href="{% url 'leads:lead-list' %}" class="mr-5 text-white/90 hover:text-white font-medium px-3 py-2 rounded-lg hover:bg-white/10 transition-all duration-300">
          Leads
        </a>
        <span class="mr-3 text-sm text-white/80 bg-white/10 px-3 py-1 rounded-full">
          Hello, {{ request.user.username }}
        </span>
      {% endif %}
    </nav>

    {% if request.user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}" class="inline">
        {% csrf_token %}
        <button type="submit" class="inline-flex items-center bg-white text-indigo-600 border-0 py-2 px-4 focus:outline-none hover:bg-gray-100 rounded-full text-sm font-semibold shadow-md hover:shadow-lg transition-all duration-300 transform hover:scale-105">
          Logout
          <svg class="ml-1 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
        </button>
      </form>
    {% else %}
      <a href="{% url 'login' %}" class="inline-flex items-center bg-white text-indigo-600 border-0 py-2 px-5 focus:outline-none hover:bg-gray-100 rounded-full text-sm font-bold shadow-md hover:shadow-lg transition-all duration-300 transform hover:scale-105">
        Login
        <svg class="ml-1 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
        </svg>
      </a>
    {% endif %}
  </div>
</header>
