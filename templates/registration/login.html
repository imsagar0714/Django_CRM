{% extends 'base.html' %}
{% load tailwind_filters %}
{% block content %}
<div class="max-w-lg mx-auto">
    <form method="post" class="bg-white p-6 rounded-lg shadow-md">
        {% csrf_token %}
        {{ form|crispy }}

        <!-- Styled Login Button -->
        <button 
            type="submit" 
            class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400 transition duration-300 ease-in-out">
            Login
        </button>

        <hr class="my-4" />

        <!-- Forgot Password Link -->
        <a href="{% url 'reset-password' %}" class="block text-center text-blue-600 hover:underline">
            Forgot password?
        </a>

        <!-- Signup Section -->
        <p class="mt-4 text-center text-gray-600">
            Don’t have an account?
            <a href="{% url 'signup' %}" class="text-blue-600 font-semibold hover:underline">
                Sign up
            </a>
        </p>
    </form>
</div>
{% endblock content %}
