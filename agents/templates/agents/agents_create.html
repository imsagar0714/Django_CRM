{% extends "base.html" %}
{% load tailwind_filters %}

{% block content %}
<section class="bg-gray-50 min-h-screen flex items-center justify-center py-12">
  <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-8">
    
    <!-- Back link -->
    <a href="{% url 'agents:agents-list' %}" class="text-indigo-600 hover:text-indigo-800 font-medium mb-4 inline-block">&larr; Go back to Agents</a>
    
    <!-- Heading -->
    <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">Create a New Agent</h1>
    
    <!-- Form -->
    <form method="post" class="space-y-5">
        {% csrf_token %}
        {{ form|crispy }}
        
        <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded transition">Submit</button>
        
        <!-- Forgot password link -->
        <div class="text-center mt-4">
          <a href="#" class="text-sm text-gray-500 hover:text-indigo-500 transition">Forgot password?</a>
        </div>
    </form>
    
  </div>
</section>
{% endblock content %}
