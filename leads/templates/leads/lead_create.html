{% extends "base.html" %}
{% load tailwind_filters %}
{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="w-full max-w-lg bg-white p-6 rounded-2xl shadow-lg">
        
        <!-- Back to Leads -->
        <a href="{% url 'leads:lead-list' %}" 
           class="inline-block mb-4 text-blue-600 hover:underline">
           ← Go back to leads
        </a>

        <!-- Title -->
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">
            Create a New Lead
        </h1>

        <!-- Form -->
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form|crispy }}

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full bg-green-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-400 transition duration-300 ease-in-out">
                Submit
            </button>
        </form>
    </div>
</div>
{% endblock content %}
